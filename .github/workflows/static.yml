# Workflow simples para compilar e implantar conteúdo estático no GitHub Pages
name: Deploy to GitHub Pages

on:
  # Executa ao fazer push nos branches principais
  push:
    branches: ["main", "master"]

  # Permite execução manual na aba Actions
  workflow_dispatch:

# Define permissões padrão do GITHUB_TOKEN para permitir implantação no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma implantação concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install

      - name: Compilar (Build)
        run: bun run build

      - name: Configurar Páginas
        uses: actions/configure-pages@v4

      - name: Enviar artefato do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
