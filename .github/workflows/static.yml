# Workflow simples para compilar e implantar conteúdo estático no GitHub Pages
name: Deploy to GitHub Pages

on:
  # Executa ao fazer push nos branches principais
  push:
    branches: ["main", "master"]

  # Permite execução manual na aba Actions
  workflow_dispatch:

# Define permissões padrão do GITHUB_TOKEN para permitir implantação no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas uma implantação concorrente por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar projeto (Build)
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do build
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
